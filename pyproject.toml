[project]
name = "dexhand-bench"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "hydra-core>=1.3,<1.4",
    "gymnasium>=1.0",
    "mjbatch-uni==0.2.5",
    "mujoco==3.11.0",
    "numpy==2.2.6",
    "omegaconf>=2.3,<2.4",
    "pillow>=11",
    "prettytable>=3.10",
    "torch==2.11.0+cpu",
    "trimesh>=4,<5",
    "unisim-core==2.7.1",
    "viser==1.0.26",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
